name: collect

# One long-running job samples every 5 minutes on its own clock (GitHub's cron
# is best-effort and often hours late). Each run lasts ~5.5 h, then dispatches
# its successor. The cron below is only a backstop that restarts the chain if
# it ever breaks; while a run is active, extra triggers just wait in the queue.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: Europe/Vienna
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: store
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr ffmpeg > /dev/null
          pip install -q yt-dlp pillow
      - name: Sample every 5 minutes
        working-directory: store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + 330 * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            python ../logger.py data.csv || true
            if ! git diff --quiet; then
              git commit -qam "sample $(date +%FT%R)"
              for i in 1 2 3; do git push -q && break; git pull -q --rebase; done
            fi
            sleep $(( 300 - $(date +%s) % 300 ))
          done
      - name: Start the next run
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref main -R "$GITHUB_REPOSITORY"
