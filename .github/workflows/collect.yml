name: collect

on:
  schedule:
    # Every 5 min, 04:00-21:55 UTC (covers Vienna opening hours in CET and CEST;
    # logger.py skips anything outside them). GitHub often runs these late.
    - cron: "*/5 4-21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      TZ: Europe/Vienna
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: store
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr ffmpeg > /dev/null
          pip install -q yt-dlp pillow
      - name: Sample
        run: python logger.py store/data.csv
      - name: Commit sample
        working-directory: store
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "sample $(date +%FT%R)"
          for i in 1 2 3; do git push -q && exit 0; git pull -q --rebase; done
          exit 1
